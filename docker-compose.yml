version: "3.9"

# ============================================================
# SPIDER-VERSE CTF — Docker Compose
# Deploys: CTFd + MariaDB + Redis
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d
#   3. Browse to http://localhost:8000
# ============================================================

services:

  # ── CTFd Application ──────────────────────────────────────
  ctfd:
    image: ctfd/ctfd:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - UPLOAD_FOLDER=/var/uploads
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=false
    volumes:
      # Custom Spider-Verse theme
      - ./ctfd/theme/spider-verse:/opt/CTFd/CTFd/themes/spider-verse:ro
      # Persistent uploads (PCAP attachments)
      - uploads:/var/uploads
      - logs:/var/log/CTFd
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ctfd_network

  # ── MariaDB Database ──────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ctfd_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Redis Cache ───────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - ctfd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  uploads:
  logs:

networks:
  ctfd_network:
    driver: bridge
